<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Página não encontrada · Clínica Rocha Galvão</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0F3B3A">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/assets/css/style.css">
  <style>
    .erro {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px var(--gutter);
      text-align: center;
    }
    .erro__caixa { max-width: 32em; display: grid; justify-items: center; gap: 20px; }
    .erro__caixa img { height: 56px; width: auto; }
    .erro__caixa p { color: var(--texto-suave); }
    .erro__acoes { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
  </style>
</head>
<body>
  <main class="erro">
    <div class="erro__caixa">
      <a href="/" aria-label="Clínica Rocha Galvão — início"><img src="/assets/img/rochagalvao_horizontal_cor.svg" alt="Clínica Rocha Galvão"></a>
      <h1>Esta página não existe.</h1>
      <p>O endereço pode ter sido digitado errado ou a página foi movida. O que você procura está na página inicial.</p>
      <div class="erro__acoes">
        <a class="botao botao--principal" href="/">Ir para a página inicial</a>
        <a class="botao botao--contorno" href="/#contato">Falar com a clínica</a>
      </div>
    </div>
  </main>
</body>
</html>
